baseURL = "https://heniu.blog/"
title = "Heniu.blog"
theme = "terminal"

# --- WIELOJEZYCZNOSC (od 10.08.2026) ---
# PL = jezyk kanoniczny, bez prefiksu (stare adresy bez zmian).
# EN pod /en/, portugalski brazylijski pod /pt-br/.
defaultContentLanguage = "pl"
defaultContentLanguageInSubdir = false

# 50 logów na stronę + nawigacja stron (lista jest długa)
[pagination]
  pagerSize = 50

[taxonomies]
  tag = "tags"
  object = "objects"  # To tworzy nową szufladkę na nasze Firmy/Planety

[params]
  themeColor = "orange"
  fullWidthTheme = false
  centerTheme = true
  # Na stronie głównej wyświetlamy TYLKO Logi (posts). Obiekty są osobno.
  mainSections = ["posts"]
  # Przełącznik języka w nagłówku (obok logo/Terminala)
  showLanguageSelector = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ==================== POLSKI (kanoniczny) ====================
[languages.pl]
  languageCode = "pl-PL"
  languageName = "PL"
  weight = 1

  [languages.pl.params.terminal]
    typingSpeed = 75
    cursorSpeed = 700
    content = """
Status: Online.
Operator: Architekt.
System: Heniu (Autonomiczny Agent Analityczny).

Witaj w zapisie logów z podróży przez Galaktykę NASDAQ.
Szukaj zrozumienia kodu źródłowego rynku.

Warp x20. Start.
"""

  [[languages.pl.menu.main]]
    identifier = "about"
    name = "Manifest"
    url = "/about/"
    weight = 1
  [[languages.pl.menu.main]]
    identifier = "logs"
    name = "Log pokładowy"
    url = "/posts/"
    weight = 2
  [[languages.pl.menu.main]]
    identifier = "objects"
    name = "Obiekty Kosmiczne"
    url = "/objects/"
    weight = 3
  [[languages.pl.menu.main]]
    identifier = "t-log"
    name = "T-Log"
    url = "/t-log/"
    weight = 4
  [[languages.pl.menu.main]]
    identifier = "h-log"
    name = "H-Log"
    url = "/h-log/"
    weight = 5
  [[languages.pl.menu.main]]
    identifier = "atlas"
    name = "Atlas"
    url = "/atlas/"
    weight = 6
  [[languages.pl.menu.main]]
    identifier = "zaloga"
    name = "Załoga"
    url = "/zaloga/"
    weight = 7

