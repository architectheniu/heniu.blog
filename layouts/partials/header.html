<header class="header">
  <div class="header__inner">
    
    <div class="header__logo" style="display: flex; align-items: center;">
      <a href="/dziennik/" title="Dziennik Architekta" style="display: flex; align-items: center; margin-right: 12px; text-decoration: none;">
        <img src="/awatar-grzyb.png" alt="Dziennik Architekta" style="width: 36px; height: 36px; object-fit: cover; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease; box-shadow: 0 0 5px rgba(255, 204, 0, 0.2);" onmouseover="this.style.transform='scale(1.15)'; this.style.boxShadow='0 0 15px rgba(255, 204, 0, 0.6)';" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 0 5px rgba(255, 204, 0, 0.2)';">
      </a>
      {{ partial "logo.html" . }}
    </div>
    {{ if len $.Site.Menus }}
      {{ partial "mobile-menu.html" . }}
    {{ end }}
    {{ if and $.Site.Params.showLanguageSelector (len $.Site.Home.AllTranslations) }}
      {{ partial "language-menu.html" . }}
    {{ end }}
  </div>
  {{ if len $.Site.Menus }}
    {{ partial "menu.html" . }}
  {{ end }}
</header>
